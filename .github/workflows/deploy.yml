name: Deploy Python Web
on: [push]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enviar Código via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "."
          target: "/var/inetpub/wwwroot/projetos/lab${{ vars.ALUNO_NUM }}"

      - name: Poetry & PM2 Restart via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. Carregar variáveis de ambiente (Poetry e NVM/PM2) para a sessão SSH não-interativa
            export PATH="$HOME/.local/bin:$HOME/.poetry/bin:$PATH"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # 2. Entrar na pasta do Lab
            cd /var/inetpub/wwwroot/projetos/lab${{ vars.ALUNO_NUM }}
            
            # 3. Instalar dependências com o Poetry
            poetry install --only main
            
            # 4. Restart Inteligente no PM2
            pm2 delete "lab-${{ vars.ALUNO_NUM }}" || true
            pm2 start "poetry run gunicorn -b 0.0.0.0:80${{ vars.ALUNO_NUM }} main:app" --name "lab-${{ vars.ALUNO_NUM }}"
            pm2 save
